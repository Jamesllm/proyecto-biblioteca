<form class="formulario formulario--centrado" [formGroup]="form" (ngSubmit)="registrar()" novalidate>
  <h1>Crear cuenta de estudiante</h1>

  @if (error()) {
    <p class="alerta" role="alert">{{ error() }}</p>
  }

  <label class="campo">
    <span>Nombre completo</span>
    <input type="text" formControlName="nombre" autocomplete="name" />
    <app-field-error [control]="form.controls.nombre" etiqueta="El nombre" />
  </label>

  <div class="fila-campos">
    <label class="campo">
      <span>DNI (opcional)</span>
      <input type="text" formControlName="dni" inputmode="numeric" />
      <app-field-error [control]="form.controls.dni" mensajeFormato="El DNI debe tener entre 8 y 15 dígitos." />
    </label>
    <label class="campo">
      <span>Teléfono (opcional)</span>
      <input type="tel" formControlName="telefono" autocomplete="tel" />
      <app-field-error [control]="form.controls.telefono" />
    </label>
  </div>

  <label class="campo">
    <span>Correo electrónico</span>
    <input type="email" formControlName="email" autocomplete="email" />
    <app-field-error [control]="form.controls.email" etiqueta="El correo" />
  </label>

  <label class="campo">
    <span>Dirección (opcional)</span>
    <input type="text" formControlName="direccion" autocomplete="street-address" />
    <app-field-error [control]="form.controls.direccion" />
  </label>

  <div class="fila-campos">
    <label class="campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      <app-field-error [control]="form.controls.password" etiqueta="La contraseña" />
    </label>
    <label class="campo">
      <span>Confirmar contraseña</span>
      <input type="password" formControlName="confirmar" autocomplete="new-password" />
      <app-field-error [control]="form.controls.confirmar" etiqueta="La confirmación" />
      @if (form.hasError('noCoincide') && form.controls.confirmar.touched) {
        <small class="error-campo" role="alert">Las contraseñas no coinciden.</small>
      }
    </label>
  </div>

  <button type="submit" class="btn btn--primario" [disabled]="enviando()">
    {{ enviando() ? 'Registrando...' : 'Crear cuenta' }}
  </button>
  <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</form>
